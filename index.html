<!DOCTYPE html>
<html>
<head>
    <title>Depilación láser Bek-ech</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
        background-color: #0a3d2c;
        font-family: "Helvetica Neue", sans-serif;
        color: #ffffff;
 }
   section {
    min-height: 50vh;
    padding: 40px;
    margin-bottom: 190px;
    background-color: #0a3d2c;
    border: 1px solid #b87333;
    border-radius: 10px;
    color: #ffffff;
      text-align: center;
      max-width: 800px;
      margin-left: auto;
margin-right: auto;
  }
   h1 { font-size: 30px; }
  a {
    color: #cfe0f0;
        display: inline-block;
        padding: 15px 30px;
        background-color: #d4af37;
}
    a:hover {
    background-color: #ffd700;
        box-shadow: 0 0 15px #ffd700;
}
     nav a {
font-weight: bold;
}
   .tarjeta {
    text-align: center;
        border: 2px solid #b87333;
     }
    .fila-tarjetas { display: flex; justify-content: center; gap: 20px;}
  .iconos {
    display: flex;
    justify-content:center;
    gap: 20px;
    font-size: 2rem;
        margin-top: 20px;
         animation: emergerIconos 0.6s ease-out;
        }
  @keyframes emergerIconos {
    from {
        transform: translateY(30px);
        opacity: 1;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}
